[package]
name = "usdcc-token"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/00impera/usdcc-token"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.6.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/near:0.8.1-rust-1.95.0"
image_digest = "sha256:..."
container_build_command = ["cargo", "near", "build"]
